<div class="container py-5">
  <h1>Resumen de tu compra</h1>
  @for (i of items; track i.id_producto) {
    <p>{{ i.nombre }} x {{ i.cantidad }} — ${{ i.precio_unitario }}</p>
  }
  <h3>Total: ${{ total() }}</h3>
  @if (error) { <p class="text-danger">{{ error }}</p> }
  @if (items.length > 0) { <button class="btn btn-warning" (click)="finalizar()">Confirmar compra</button> }
  @else { <p>No hay productos en el carrito.</p> }
</div>
