
<div class="grilla">
  @for (productos of infoIndumentaria; track productos.id) {
    <div class="card">

      <button class="favorite-icon" (click)="toggleFavorito(productos)">
        @if (favoritos.estaEnFavoritos(productos.id)) {
          ★
        } @else {
          ☆
        }
      </button>

      <img [src]="productos.img" [alt]="productos.alt" />

      <h3>{{ productos.titulo }}</h3>

      <p>{{ productos.descripcion }}</p>

      <p>{{ productos.descripcion2 }}</p>

      <p class="precio">
        {{ productos.precio | currency:'ARS':'symbol':'1.0-0':'es-AR' }}
      </p>

      <button class="btn btn-warning mt-auto"
        (click)="agregarAlCarrito(productos)">
        Añadir al carrito
      </button>

    </div>
  } @empty {
    <p>No hay productos para mostrar.</p>
  }
</div>
