<div class="container mt-5">
  <div class="d-flex gap-2 mb-4">
    <input class="form-control" [(ngModel)]="buscar" (keyup.enter)="cargar()" placeholder="Buscar productos...">
    <button class="btn btn-warning" (click)="cargar()">Buscar</button>
  </div>
  @if (error) { <p class="text-danger">{{ error }}</p> }
  <div class="row">
    @for (p of productos; track p.id) {
      <div class="col-lg-4 col-md-6 mb-4">
        <div class="card product-card h-100">
          <img [src]="imagen(p.imagen)" class="card-img-top" [alt]="p.nombre">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ p.nombre }}</h5>
            <p class="card-text">{{ p.descripcion }}</p>
            <p class="price">${{ p.precio }}</p>
            <div class="mt-auto d-flex gap-2">
              <button class="btn btn-primary" (click)="agregar(p.id)">Añadir al carrito</button>
              <button class="btn btn-outline-warning" (click)="favorito(p.id)">☆</button>
            </div>
          </div>
        </div>
      </div>
    } @empty { <p>No se encontraron productos.</p> }
  </div>
</div>
