<div class="offers-container">
  @for (producto of infoDescuento; track producto.id) {
    <div class="offer-card">
      <span class="offer-badge">🔥 OFERTA</span>
      <img [src]="imagen(producto.imagen)" [alt]="producto.nombre" class="offer-img">
      <div class="offer-body">
        <h3 class="offer-title">{{ producto.nombre }}</h3>
        <p class="offer-description">{{ producto.descripcion }}</p>
        <div class="prices"><span class="new-price">${{ producto.precio }}</span></div>
        <button class="btn-offer" (click)="agregarAlCarrito(producto)">Añadir al carrito</button>
      </div>
    </div>
  } @empty { <p>No hay productos para mostrar.</p> }
</div>
