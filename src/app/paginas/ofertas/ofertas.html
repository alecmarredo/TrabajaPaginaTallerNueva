<div class="contenedor">
  <h2 class="titulo-seccion">Ofertas</h2>

  <div class="grilla">
    @for (p of infoDescuento(); track p.id) {
      <div class="tarjeta">

        <div class="tarjeta-img">
          <span class="etiqueta-oferta">
            -{{ descuento(p) }}%
          </span>

          <img [src]="imagen(p.imagen)" [alt]="p.nombre">
        </div>

        <div class="tarjeta-cuerpo">
          <h5 class="tarjeta-titulo">{{ p.nombre }}</h5>

          <p class="tarjeta-desc">{{ p.descripcion }}</p>

          <div class="tarjeta-precio">
            <span class="precio-actual">
              ${{ p.precio_oferta }}
            </span>

            <span class="precio-viejo">
              ${{ p.precio }}
            </span>
          </div>

          <button class="btn-carrito" (click)="agregarAlCarrito(p)">
            Añadir al carrito
          </button>
        </div>

      </div>
    } @empty {
      <p class="vacio">No hay ofertas por el momento.</p>
    }
  </div>
</div>
